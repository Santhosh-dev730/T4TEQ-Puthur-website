<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/locomotive-scroll/dist/locomotive-scroll.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/locomotive-scroll/dist/locomotive-scroll.min.js"></script>

    <title>Interactive Hero</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer {
            position: absolute;
            will-change: transform;
        }

        .blob {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at center, #6366f1, transparent);
            filter: blur(120px);
            top: 20%;
            left: 40%;
        }

        .illustration img {
            width: 500px;
        }

        .floating-card {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="main" data-scroll-container>

        <section class="hero">

            <!-- Background Blob -->
            <div class="layer blob" data-speed="0.1"></div>

            <!-- Illustration -->
            <div class="layer illustration" data-speed="0.3">
                <img src="assets/immersive-visualization.jpg" alt="">
            </div>

            <!-- Foreground Card -->
            <div class="layer card" data-speed="0.6">
                <div class="floating-card">Live Dashboard</div>
            </div>

            <!-- Hero Text -->
            <div class="hero-content">
                <h1 class="hero-title">Next Gen Marketing Platform</h1>
                <p class="hero-sub">Grow smarter with data-driven campaigns</p>
                <button class="cta">Get Started</button>
            </div>

        </section>

    </div>


    <script>

        gsap.registerPlugin(ScrollTrigger);

        const locoScroll = new LocomotiveScroll({
            el: document.querySelector("#main"),
            smooth: true
        });

        locoScroll.on("scroll", ScrollTrigger.update);

        ScrollTrigger.scrollerProxy("#main", {
            scrollTop(value) {
                return arguments.length
                    ? locoScroll.scrollTo(value, 0, 0)
                    : locoScroll.scroll.instance.scroll.y;
            },
            getBoundingClientRect() {
                return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight };
            }
        });

        ScrollTrigger.addEventListener("refresh", () => locoScroll.update());
        ScrollTrigger.refresh();


        // Scroll Reveal Timeline
        gsap.from(".hero-title", {
            y: 80,
            opacity: 0,
            duration: 1.2,
            ease: "power4.out"
        });

        gsap.from(".hero-sub", {
            y: 50,
            opacity: 0,
            duration: 1,
            delay: 0.3
        });

        gsap.from(".cta", {
            y: 40,
            opacity: 0,
            duration: 1,
            delay: 0.6
        });


        // Mouse Parallax Effect
        document.addEventListener("mousemove", (e) => {
            const layers = document.querySelectorAll(".layer");

            layers.forEach(layer => {
                const speed = layer.getAttribute("data-speed");

                const x = (window.innerWidth - e.pageX * speed) / 100;
                const y = (window.innerHeight - e.pageY * speed) / 100;

                gsap.to(layer, {
                    x: x,
                    y: y,
                    duration: 0.6,
                    ease: "power3.out"
                });
            });
        });

    </script>


</body>

</html>
