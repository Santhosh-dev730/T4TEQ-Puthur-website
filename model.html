<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"></script>
    <style>
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 18s linear infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) translateZ(30px);
            }

            50% {
                transform: translateY(-8px) translateZ(30px);
            }
        }

        @keyframes float-delayed {

            0%,
            100% {
                transform: translateY(0px) translateZ(40px);
            }

            50% {
                transform: translateY(-6px) translateZ(40px);
            }
        }

        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float-delayed 4s ease-in-out infinite;
        }

        @keyframes gradient-text {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .animate-gradient-text {
            background: linear-gradient(135deg, #f97316, #6366f1, #f97316);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-text 4s ease infinite;
        }

        /* Rotating text */
        .rotating-text-wrapper {
            height: 2em;
            overflow: hidden;
        }

        .rotating-text-list {
            animation: rotate-text 6s steps(1) infinite;
        }

        @keyframes rotate-text {
            0% {
                transform: translateY(0%);
            }

            25% {
                transform: translateY(-25%);
            }

            50% {
                transform: translateY(-50%);
            }

            75% {
                transform: translateY(-75%);
            }
        }

        .rotating-text-list span {
            display: block;
            line-height: 2em;
        }

        /* Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            animation: revealIn 0.7s ease forwards;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        @keyframes revealIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-white">

    <section class="py-6 lg:py-12 bg-white overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 pt-6">

            <!-- Main Rounded Container -->
            <div class="bg-[#f5f6f8] rounded-3xl relative overflow-hidden">

                <!-- Decor -->
                <div class="absolute inset-0 pointer-events-none overflow-hidden">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-blue-100/50 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-64 h-64 bg-purple-100/50 rounded-full blur-3xl translate-y-1/3 -translate-x-1/3">
                    </div>
                    <svg class="absolute w-full h-full" viewBox="0 0 1000 800" preserveAspectRatio="none">
                        <path d="M-50,800 C 200,750 350,600 550,600 C 750,600 850,200 1100,100" fill="none"
                            stroke="#f97316" stroke-width="3" opacity="0.6" stroke-linecap="round" />
                    </svg>
                </div>

                <!--
                RESPONSIVE GRID:
                - Mobile (default): single column, spline on top, content below
                - lg+: two columns, content left (60%), spline right (40%)
            -->
                <div
                    class="grid grid-cols-1 lg:grid-cols-[60%_40%] gap-8 lg:gap-12 items-center px-6 py-8 lg:px-12 lg:py-12 relative z-10">

                    <!-- ===== SPLINE CARD — ORDER: top on mobile, right on lg ===== -->
                    <!-- On mobile: order-1 (first), on lg: order-2 (second/right) -->
                    <div class="order-1 lg:order-2 flex justify-center lg:justify-end">

                        <!-- 3D Tilt Card -->
                        <div id="hero-tilt-card" class="relative w-full max-w-[360px] sm:max-w-[400px] lg:max-w-[420px]"
                            style="transform-style: preserve-3d; transition: transform 0.12s ease-out; will-change: transform;">

                            <!-- Spline Viewer -->
                            <div class="relative rounded-[32px] overflow-hidden h-[320px] sm:h-[380px] lg:h-[420px]">
                                <!-- Rotating Text Overlay -->
                                <div class="absolute left-12 z-30 pointer-events-none top-6">
                                    <div
                                        class="rotating-text-wrapper font-black text-xl sm:text-2xl uppercase tracking-tighter">
                                        <div class="rotating-text-list flex flex-col">
                                            <span class="animate-gradient-text">Programming</span>
                                            <span class="animate-gradient-text">Full Stack</span>
                                            <span class="animate-gradient-text">Data Analytics</span>
                                            <span class="animate-gradient-text">UI/UX Designing</span>
                                        </div>
                                    </div>
                                </div>
                                <spline-viewer url="https://prod.spline.design/Bi4UqtdOOu5F6ZkD/scene.splinecode"
                                    class="absolute inset-0 w-full h-[110%] -bottom-[10%]">
                                </spline-viewer>
                            </div>

                            <!-- Floating: ISO Badge -->
                            <div class="absolute bottom-10 -right-4 z-20 animate-float-delayed">
                                <div
                                    class="bg-orange-500 text-white rounded-full px-4 py-2 flex items-center gap-2 shadow-lg text-sm font-bold">
                                    <span class="material-symbols-outlined text-base">verified</span>
                                    ISO Certified
                                </div>
                            </div>

                            <!-- Floating: Students count -->
                            <div class="absolute -top-2 -right-4 z-20 animate-float" style="animation-delay: 0.5s;">
                                <div
                                    class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-100 px-4 py-3 min-w-[130px]">
                                    <div
                                        class="text-slate-400 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">
                                        <span
                                            class="material-symbols-outlined text-emerald-500 text-sm">trending_up</span>
                                        Students
                                    </div>
                                    <div class="text-slate-900 text-2xl font-black mt-0.5">1,000+</div>
                                    <div class="text-emerald-500 text-[10px] font-bold">↑ +96.5% this year</div>
                                </div>
                            </div>

                            <!-- Floating: Placement rate -->
                            <div class="absolute -bottom-10 -left-4 z-20 animate-float-delayed"
                                style="animation-delay: 1s;">
                                <div
                                    class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-100 px-4 py-3 min-w-[140px]">
                                    <div
                                        class="text-slate-400 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">
                                        <span class="material-symbols-outlined text-blue-500 text-sm">work</span>
                                        Placement
                                    </div>
                                    <svg width="40" height="40" viewBox="0 0 40 40" class="my-1">
                                        <circle cx="20" cy="20" r="15" fill="none" stroke="#e2e8f0" stroke-width="5" />
                                        <circle cx="20" cy="20" r="15" fill="none" stroke="#f97316" stroke-width="5"
                                            stroke-dasharray="75.4 94.2" stroke-dashoffset="23.6" stroke-linecap="round"
                                            transform="rotate(-90 20 20)" />
                                    </svg>
                                    <div class="text-slate-900 text-xl font-black leading-none">80%</div>
                                    <div class="text-slate-400 text-[10px]">Success rate</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ===== END SPLINE CARD ===== -->


                    <!-- ===== LEFT CONTENT — ORDER: bottom on mobile, left on lg ===== -->
                    <!-- On mobile: order-2 (second/below), on lg: order-1 (first/left) -->
                    <div class="order-2 lg:order-1 space-y-6 lg:space-y-8 mt-8 sm:mt-10 lg:mt-0">

                        <!-- Headline -->
                        <div class="space-y-4">
                            <h1
                                class="text-4xl sm:text-5xl md:text-6xl font-bold leading-tight text-slate-900 tracking-tight reveal">
                                Helping you become outstanding by Making Tech
                                <span class="animate-gradient-text">Simple</span>
                            </h1>
                        </div>

                        <!-- Tech Carousel -->
                        <div class="reveal delay-300">
                            <div class="relative w-full overflow-hidden py-4">
                                <ul class="animate-marquee items-center list-none m-0 p-0">
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/python.jpg"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="Python">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/java.png" class="h-10 w-10 hover:scale-110 transition-all"
                                                alt="Java">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/react.png" class="h-10 w-10 hover:scale-110 transition-all"
                                                alt="React">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/springboot.png"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="Spring Boot">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/mongodb.png"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="MongoDB">
                                        </div>
                                    </li>
                                    <!-- Duplicates for seamless loop -->
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/python.jpg"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="Python">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/java.png" class="h-10 w-10 hover:scale-110 transition-all"
                                                alt="Java">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/react.png" class="h-10 w-10 hover:scale-110 transition-all"
                                                alt="React">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/springboot.png"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="Spring Boot">
                                        </div>
                                    </li>
                                    <li class="inline-block px-4 sm:px-8">
                                        <div
                                            class="h-20 w-20 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center shadow-sm">
                                            <img src="assets/mongodb.png"
                                                class="h-10 w-10 hover:scale-110 transition-all" alt="MongoDB">
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- CTA Buttons -->
                        <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 w-full max-w-2xl reveal delay-200">
                            <!-- Daily MCQs -->
                            <button
                                class="flex-1 bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 hover:shadow-lg hover:border-orange-500 transition-all group text-left relative overflow-hidden">
                                <div class="absolute right-2 bottom-2 h-1 w-1 bg-orange-500 rounded-full"></div>
                                <div
                                    class="h-10 w-10 bg-slate-50 rounded-lg flex items-center justify-center group-hover:bg-orange-50 transition-colors flex-shrink-0">
                                    <span
                                        class="material-symbols-outlined text-2xl text-slate-700 group-hover:text-orange-500">quiz</span>
                                </div>
                                <div>
                                    <h3 class="text-slate-900 font-bold text-base">Daily MCQs</h3>
                                    <p class="text-slate-400 text-xs font-medium">Join Now</p>
                                </div>
                            </button>

                            <!-- Weekly Task -->
                            <button
                                class="flex-1 bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 hover:shadow-lg hover:border-blue-600 transition-all group text-left">
                                <div
                                    class="h-10 w-10 bg-slate-50 rounded-lg flex items-center justify-center group-hover:bg-blue-50 transition-colors flex-shrink-0">
                                    <span
                                        class="material-symbols-outlined text-2xl text-slate-700 group-hover:text-blue-600">code</span>
                                </div>
                                <div>
                                    <h3 class="text-slate-900 font-bold text-base">Weekly Task</h3>
                                    <p class="text-slate-400 text-xs font-medium">Let's Code</p>
                                </div>
                            </button>

                            <!-- Job Placement -->
                            <button
                                class="flex-1 bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 hover:shadow-lg hover:border-blue-600 transition-all group text-left">
                                <div
                                    class="h-10 w-10 bg-slate-50 rounded-lg flex items-center justify-center group-hover:bg-blue-50 transition-colors flex-shrink-0">
                                    <span
                                        class="material-symbols-outlined text-2xl text-slate-700 group-hover:text-blue-600">work</span>
                                </div>
                                <div>
                                    <h3 class="text-slate-900 font-bold text-base">Job Placement</h3>
                                    <p class="text-slate-400 text-xs font-medium">Join Now</p>
                                </div>
                            </button>
                        </div>

                    </div>
                    <!-- ===== END LEFT CONTENT ===== -->

                </div>
            </div>
        </div>
    </section>


</body>

</html>
