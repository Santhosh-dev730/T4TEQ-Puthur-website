<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particles + Infinite Logo Animation</title>




<style>
/* Reset */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* Full screen body */
html, .logo-container{
  width:100%;
  height:100%;
  font-family: Arial, Helvetica, sans-serif;
}

/* Full screen particles */
#particles-js{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(240, 246, 241, 1);
  z-index:-1;
}

/* Center content on screen */
.logo-container{
  position:relative;
  width: 80%; 
   height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  margin:auto;
}

/* Logo styling */
.logo-box{
  width:20%;
  height:20%;
  overflow:hidden;
  position:relative;
  /* box-shadow: 1px 1px 10px gray; */
}

.logo-slide{
  position:absolute;
  width:100%;
  height:200%;
  transition:transform 0.8s ease-in-out;
}

.logo-slide img{
  width:120px;
  height:120px;
  display:block;
  /* background:white; */
    background:rgba(240, 246, 241, 1);
  border-radius:12px;
  padding:10px;
  filter:grayscale(100%);
  transition:0.3s;
}

.logo-slide img:hover{
  filter:grayscale(0%);
  transform:scale(1.1);
}
</style>

</head>
<body>

<section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    

<!-- Logo Section -->
<div class="logo-container">

  <div class="logo-box">
    <div class="logo-slide">
      <img src="zoho.jpg">
      <img src="g.png">
    </div>
  </div>

  <div class="logo-box">
    <div class="logo-slide">
      <img src="ibm.png">
      <img src="acc.jpg">
    </div>
  </div>

  <div class="logo-box">
    <div class="logo-slide">
      <img src="bmw.jpg">
      <img src="tcs.jpg">
    </div>
  </div>

  <div class="logo-box">
    <div class="logo-slide">
      <img src="benz.png">
      <img src="vd.png">
    </div>
  </div>

  <div class="logo-box">
    <div class="logo-slide">
      <img src="mice.png">
      <img src="acce.png">
    </div>
  </div>

</div>
</section>


<script>

const slides = document.querySelectorAll(".logo-slide");
let showingSecond = false;

function animateLogos() {
  let delay = 0;

  slides.forEach((slide) => {
    setTimeout(() => {
      slide.style.transform = showingSecond
        ? "translateY(0)"
        : "translateY(-120px)";
    }, delay);
    delay += 500;
  });

  showingSecond = !showingSecond;
}

setTimeout(() => {
  animateLogos();
  setInterval(animateLogos, 4000);
}, 3000);
</script>

</body>
</html>
