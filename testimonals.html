<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            grid-auto-rows: auto;
            gap: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .reviews-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }
        
        .review-card {
            height: fit-content;
        }
    </style>
</head>
<body class="bg-gray-100">
    
    <!-- Student Review Section -->
    <section class="w-full bg-gray-100 py-20">
        <div class="max-w-7xl mx-auto px-6">
            
            <!-- Section Header -->
            <div class="text-center mb-16">
                <p class="text-xs font-semibold tracking-widest text-gray-600 uppercase mb-3">
                    Student Review
                </p>
                <h2 class="text-4xl md:text-5xl font-semibold text-gray-900">
                    Hear from students like you
                </h2>
            </div>

            <!-- Reviews Grid -->
            <div id="reviewsGrid" class="reviews-grid">
                <!-- Cards will be dynamically inserted here -->
            </div>

        </div>
    </section>

    <script>
        // Reviews data
        const reviews = [
            {

            },
            {

                name: "Lorem Ipsum",
                company: "@Google",
                showLogo: false
            },
            {

                name: "Lorem Ipsum",
                company: "@Google",

            },
            {
                text: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen bookLorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book",
                name: "Lorem Ipsum",
                company: "@Google",
                showLogo: true
            },
            {
                text: "Lorem Ipsum is simply dummy text of the printing and typesetting industry.",
                name: "Lorem Ipsum",
                company: "@Google",
                showLogo: false
            },
            {
                text: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen bookLorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book",
                name: "Lorem Ipsum",
                company: "@Google",
                showLogo: false
            }
        ];

        // Google logo SVG
        const googleLogo = `
            <svg class="w-8 h-8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
        `;

        // Function to create review card
        function createReviewCard(review) {
            const card = document.createElement('div');
            card.className = 'review-card bg-gray-200 rounded-3xl p-8 shadow-md hover:shadow-xl transition-shadow duration-300 flex flex-col';
            
            card.innerHTML = `
                <p class="text-gray-800 leading-relaxed mb-6 flex-grow">
                    ${review.text}
                </p>
                <div class="flex items-center justify-between mt-auto">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gray-400 rounded-full flex-shrink-0"></div>
                        <div>
                            <p class="font-semibold text-gray-900">${review.name}</p>
                            <p class="text-sm text-gray-600">${review.company}</p>
                        </div>
                    </div>
                    ${review.showLogo ? `<div class="flex-shrink-0">${googleLogo}</div>` : ''}
                </div>
            `;
            
            return card;
        }

        // Render all review cards
        function renderReviews() {
            const grid = document.getElementById('reviewsGrid');
            reviews.forEach(review => {
                const card = createReviewCard(review);
                grid.appendChild(card);
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderReviews);
    </script>

</body>
</html>
